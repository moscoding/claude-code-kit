name: checks

on:
  push:
  workflow_dispatch:

jobs:
  checks:
    name: Тесты и проверки набора
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Тесты
        run: python -m unittest -v
      - name: Учебный набор
        run: git clone --depth 1 https://github.com/moscoding/claude-code-kit ../claude-code-kit
      - name: Проверки набора
        run: python ../claude-code-kit/ci/checks/check_repo.py
